name: Windows
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  build-test-package:
    runs-on: windows-2022
    timeout-minutes: 75
    env:
      YINGHUI_PACKAGE_LITE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/cache@v4
        with:
          path: windows/.tools
          key: windows-qt-6.12.0-msvc2022-vision-embedded-v4
      - name: Install pinned Qt SDK
        run: python windows/scripts/bootstrap.py
      - name: Export and validate offline vision pack
        shell: pwsh
        run: |
          python -m venv windows/.tools/model-export
          & windows/.tools/model-export/Scripts/python.exe -m pip install torch==2.14.1 torchvision==0.29.1 --index-url https://download.pytorch.org/whl/cpu
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & windows/.tools/model-export/Scripts/python.exe -m pip install -r windows/scripts/model-export-requirements.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & windows/.tools/model-export/Scripts/python.exe windows/scripts/bootstrap_models.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Configure
        run: python windows/scripts/build.py configure
      - name: Build
        run: python windows/scripts/build.py build
      - name: Core and native UI tests
        run: python windows/scripts/build.py test
      - name: Native offline vision inference and cancellation
        shell: pwsh
        run: |
          $env:PATH = "$PWD/windows/.tools/Qt/bin;$env:PATH"
          & windows/out/release/compositor_vision_smoke.exe windows/.tools/vision-samples/truck.jpg windows/.tools/vision-samples/person.jpg windows/out/vision-validation -platform offscreen
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Independent TIFF and Photoshop validation
        run: |
          python -m pip install -r windows/tests/requirements.txt
          python windows/scripts/validate_formats.py
      - name: ComfyUI client protocol and mask tests
        run: python -m unittest discover -s windows/tests -p test_comfyui_client.py -v
      - name: Managed local image installation and integrity tests
        run: python -m unittest discover -s windows/tests -p test_local_image_worker.py -v
      - name: Large image benchmark
        shell: pwsh
        run: |
          $env:PATH = "$PWD/windows/.tools/Qt/bin;$env:PATH"
          & windows/out/release/compositor_benchmark.exe windows/out/benchmark.json -platform offscreen
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Native layouts and scaling
        run: python windows/scripts/validate_ui.py
      - name: Package and isolated runtime smoke test
        run: |
          python windows/scripts/bootstrap_embedded_ai.py
          python windows/scripts/bootstrap_embedded_image.py
          python windows/scripts/build.py package
      - name: Install, launch and uninstall smoke test
        run: python windows/scripts/install_smoke.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compositor-windows
          path: |
            windows/dist/*.zip
            windows/dist/*Installer/*
            windows/dist/SHA256SUMS.txt
            windows/dist/release-preview.png
            windows/dist/installed-preview.png
            windows/out/release/*tests.txt
            windows/out/release/*tests.xml
            windows/out/release/Testing/Temporary/LastTest.log
            windows/out/validation/results.json
            windows/out/benchmark.json
            windows/out/ui-validation/*
            windows/out/vision-validation/*
